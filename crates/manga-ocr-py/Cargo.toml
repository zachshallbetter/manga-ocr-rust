[package]
name = "manga-ocr-py"
version = "0.2.0"
edition = "2024"
authors = ["Zach Shallbetter <zachshallbetter@gmail.com>"]
description = "Zero-copy PyO3 C-extension bindings for Comic OCR Rust"

[lib]
name = "manga_ocr_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py38"] }
manga-ocr-core = { path = "../manga-ocr-core" }
manga-ocr-ort = { path = "../manga-ocr-ort" }
image = "0.25"
anyhow = "1.0"
